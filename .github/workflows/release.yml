name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      - name: Build Distribution Packages
        run: uv build

      - name: Verify Wheel Contents
        run: |
          python3 -c "
          import glob, sys, zipfile
          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 1, f'Expected 1 wheel, found {len(wheels)}'
          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
              for n in names:
                  if not (n.startswith('enviroplussensorstomqtt/') or (n.startswith('enviroplussensorstomqtt-') and '.dist-info/' in n)):
                      sys.exit(f'Forbidden file found in wheel: {n}')
          print('Wheel contents verified clean.')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
