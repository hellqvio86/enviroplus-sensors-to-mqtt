[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enviroplussensorstomqtt"
version = "0.0.2"
description = "aio library for sending enviroplus sensors data to mqtt"
readme = "README.md"
authors = [
  { name = "Olof Hellqvist", email = "olof.hellqvist@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
keywords = ["enviroplus", "temperature", "mqtt"]
dependencies = [
    "enviroplus",
    "pimoroni-bme280",
    "pms5003",
    "smbus2",
    "paho-mqtt>=2.0.0,<3.0.0",
    "pyyaml",
    "setproctitle",
]

[project.urls]
Homepage = "https://github.com/hellqvio86/enviroplus-sensors-to-mqtt"

[project.optional-dependencies]
tests = [
    "pytest",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
enviroplussensorstomqtt = "enviroplussensorstomqtt.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["enviroplussensorstomqtt*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

